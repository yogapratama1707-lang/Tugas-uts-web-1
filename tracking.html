<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Pengiriman - Toko Buku Digital</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <h2>BookStore.id</h2>
        </div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="stok.html">Informasi Stok</a>
            <a href="checkout.html">Pemesanan</a>
            <a href="tracking.html" class="active">Tracking Pengiriman</a>
            <a href="index.html" style="color: #ef4444;">Logout</a>
        </nav>
    </header>

    <div class="container">
        <h2>Tracking Status Pengiriman</h2>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Coba lacak dengan ID tes: <strong style="color: var(--primary);">DO12345</strong> atau <strong style="color: var(--primary);">DO67890</strong></p>

        <div style="display: flex; gap: 10px; margin-bottom: 2rem;">
            <input type="text" id="inputDO" placeholder="Masukkan Nomor Delivery Order (contoh: DO12345)" style="padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 10px; width: 100%; outline: none;">
            <button class="btn" onclick="cariTracking()" style="width: auto; padding: 0 2rem;">Cari</button>
        </div>

        <!-- Box Hasil Lacak -->
        <div id="hasilTracking" style="display: none; background: #f8fafc; padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-color);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="margin:0;">No. DO: <span id="trackDO" style="color: var(--primary);"></span></h3>
                <span id="trackStatus" style="background: #d1fae5; color: #065f46; font-weight: 700; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.85rem;"></span>
            </div>

            <p style="margin-bottom: 0.5rem;"><strong>Nama Pemesan:</strong> <span id="trackNama"></span></p>

            <!-- Status Progress Bar -->
            <div class="progress-container">
                <div id="progressBar" class="progress-bar">0%</div>
            </div>

            <table>
                <tr>
                    <th>Detail Ekspedisi</th>
                    <td id="trackEkspedisi"></td>
                </tr>
                <tr>
                    <th>Tanggal Kirim</th>
                    <td id="trackTanggal"></td>
                </tr>
                <tr>
                    <th>Jenis Paket</th>
                    <td id="trackPaket"></td>
                </tr>
                <tr>
                    <th>Total Pembayaran</th>
                    <td id="trackTotal" style="font-weight: 700; color: var(--primary);"></td>
                </tr>
            </table>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
